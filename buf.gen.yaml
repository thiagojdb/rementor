version: v2
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12]
    out: .
    opt:
      - module=github.com/thiagojdb/rementor
  - local: [go, run, connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0]
    out: .
    opt:
      - module=github.com/thiagojdb/rementor
  - local: web/frontend/node_modules/.bin/protoc-gen-es
    out: web/frontend/src/gen
    opt:
      - target=ts
  - local: web/frontend/node_modules/.bin/protoc-gen-connect-es
    out: web/frontend/src/gen
    opt:
      - target=ts
